<div class="login-container">
  <article class="fotologin" id="ar1"></article>

  <div class="form-container">
    <div class="card shadow-lg">
      <div class="card-body">
        <h2 class="text-center mb-4">INICIAR SESIÓN</h2>
        <p>¡Inicia sesión para poder añadir a favoritos los eventos y poder compartir tus opiniones en el diario!</p>
        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required
              placeholder="Introduce tu email" />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required
              placeholder="Introduce tu contraseña" />
          </div>

          <div class="form-group">
            <label for="codigo">Código (opcional)</label>
            <input type="text" id="codigo" class="form-control" [(ngModel)]="codigo" name="codigo"
              placeholder="Introduce tu código" />
          </div>

          <button type="submit" class="btn btn-block">Iniciar sesión</button>
          <p *ngIf="error" class="text-danger">{{ error }}</p>

        </form>
        <p>¿No tienes cuenta? <a [routerLink]="['/register']">Regístrate aquí</a></p>
        <p class="mt-2">
          <a (click)="mostrarFormularioReset()">¿Olvidaste tu contraseña?</a>
        </p>

        <div *ngIf="mostrarReset" class="recuperar-password">
          <input type="email" [(ngModel)]="emailReset" placeholder="Introduce tu email" />
          <button (click)="solicitarReset()">Enviar enlace de recuperación</button>
        </div>

      </div>
    </div>
  </div>

  <article class="fotologin" id="ar2"></article>

  <!-- Imagen especial para móviles -->
  <article class="fotologin movil" id="arMovil"></article>
  <p>"María Santísima de la Amargura Coronada", por "Nico Canela"</p>

  </div>
