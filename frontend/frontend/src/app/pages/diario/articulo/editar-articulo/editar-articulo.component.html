<form (ngSubmit)="guardarCambios()">
  <!-- Título del artículo -->
  <div class="mb-3">
    <label for="titulo" class="form-label">Título:</label>
    <input
      id="titulo"
      type="text"
      class="form-control"
      [(ngModel)]="articulo.titular"
      name="titulo"
      required
    />
  </div>

  <!-- Cuerpo del artículo (Textarea mejorado) -->
  <div class="mb-3">
    <label for="cuerpo" class="form-label">Cuerpo:</label>
    <textarea
      id="cuerpo"
      class="form-control"
      [(ngModel)]="articulo.cuerpo"
      name="cuerpo"
      rows="6"
      required
    ></textarea>
  </div>

  <button type="submit" class="btn btn-success">
    Guardar cambios
  </button>
</form>
