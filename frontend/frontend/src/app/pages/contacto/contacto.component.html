<div class="auth-page">
<div class="login-container">
  <aside class="auth-side auth-side--izq">
    <div class="auth-tagline-card">
      <span class="auth-tagline-cruz">✠</span>
      <p>¿Dudas, sugerencias o quieres colaborar? Estamos para ayudarte.</p>
    </div>
  </aside>

  <div class="form-container">
    <div class="card premium-card">
      <div class="card-body">
        <h2 class="text-center">CONTÁCTANOS</h2>
        <p class="subtitle">¿Tienes alguna duda o sugerencia? Escríbenos y te responderemos lo antes posible.</p>

        <form (ngSubmit)="onSubmit()" class="premium-form">
          <div class="form-group-custom">
            <label for="nombre">Nombre</label>
            <div class="input-wrapper">
              <i class="bi bi-person"></i>
              <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" required
                placeholder="Introduce tu nombre" />
            </div>
          </div>

          <div class="form-group-custom">
            <label for="email">Correo Electrónico</label>
            <div class="input-wrapper">
              <i class="bi bi-envelope"></i>
              <input type="email" id="email" [(ngModel)]="email" name="email" required
                placeholder="Introduce tu email" />
            </div>
          </div>

          <div class="form-group-custom">
            <label for="mensaje">Mensaje</label>
            <div class="input-wrapper input-wrapper-textarea">
              <i class="bi bi-chat-left-text"></i>
              <textarea id="mensaje" [(ngModel)]="mensaje" name="mensaje" required
                placeholder="Escribe tu mensaje aquí..." rows="4"></textarea>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <span>Enviar Mensaje</span>
            <i class="bi bi-send"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <aside class="auth-side auth-side--der">
    <div class="auth-anuncio">
      <span class="auth-anuncio-cruz">✠</span>
      <div class="auth-anuncio-label">Espacio Publicitario</div>
      <p class="auth-anuncio-texto">Anuncia tu empresa aquí y llega a miles de cofrades de toda España.</p>
      <a class="auth-anuncio-btn" href="mailto:cofradiariodemalaga@gmail.com?subject=Publicidad%20en%20Cofradiario">Contactar</a>
    </div>
  </aside>
</div>

<footer class="auth-footer">
  <span>-- 2025 Cofradiario de Málaga --</span>
</footer>
</div>
