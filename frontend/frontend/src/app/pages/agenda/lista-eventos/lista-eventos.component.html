<div class="dia-grupo-wrapper">
  @if (gruposEventos.length > 0) {
    @for (grupo of gruposEventos; track grupo.fecha; let gi = $index) {
      <div class="dia-grupo">
        <div class="dia-header">
          <div class="dia-header-linea"></div>
          <span class="dia-header-cruz">✠</span>
          <div class="dia-header-texto">{{ getDiaNombre(grupo.fecha) }}</div>
          <span class="dia-header-cruz">✠</span>
          <div class="dia-header-linea"></div>
        </div>

        <div class="grid">
          @for (evento of grupo.eventos; track evento.id; let i = $index) {
            <app-evento
              [evento]="evento"
              [cofradias]="cofradias"
              [favoritos]="favoritos"
              [eventoDestacado]="eventoDestacado"
              [style.animation-delay]="(gi * 40 + i * 65) + 'ms'"
              (favoritoAnadido)="favoritoAnadido.emit()"
              (editarSolicitado)="editarEvento.emit($event)">
            </app-evento>
          }
        </div>
      </div>
    }
  } @else {
    <div class="vacio">No se encontraron eventos.</div>
  }
</div>
