<div class="fav-card">
  <div class="fav-card-interior">
    <div class="fav-card-header">
      <div class="fav-card-titulo">{{ getEventoNombre() }}</div>
      <button class="btn-eliminar" (click)="onEliminar()" title="Quitar de favoritos">
        <i class="bi bi-trash"></i>
      </button>
    </div>
    
    <div class="fav-card-meta">
      <div class="meta-item">
        <i class="bi bi-people"></i>
        <span>{{ getCofradiaNombre() }}</span>
      </div>
      <div class="meta-item">
        <i class="bi bi-calendar3"></i>
        <span>{{ getFecha() }}</span>
      </div>
    </div>
  </div>
</div>
