<div class="feat">
  <div class="feat-top">
    <span class="feat-badge">Favorito</span>
    <button class="feat-quitar" (click)="onEliminar()" title="Quitar de favoritos">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="feat-cuando">
    <div class="feat-fecha">
      <span class="feat-day">{{ getFecha() | date:'dd' }}</span>
      <span class="feat-mo">{{ getFecha() | date:'MMM' }}</span>
    </div>
    <span class="feat-hora">{{ getFecha() | date:'HH:mm' }} h</span>
  </div>

  <div class="feat-rule"></div>

  <div class="feat-title">{{ getEventoNombre() }}</div>
  <div class="feat-banda">{{ getCofradiaNombre() }}</div>
</div>
