<section class="tiempo-container" role="list">
  <h2>PRONÓSTICO DEL TIEMPO - MÁLAGA </h2>
  <article class="weather-card" *ngFor="let dia of dias" role="listitem">
    <div class="weather-date">{{ dia.date }}</div>
    <figure class="weather-icon-wrapper">
      <img [src]="dia.icono" class="weather-icon" alt="Icono del clima" />


    </figure>
    <div class="weather-temp">{{ dia.temperatura.max }}°C / {{ dia.temperatura.min }}°C</div>
    <div class="weather-precip">{{ dia.precipitacion }}%</div>
  </article>
</section>
